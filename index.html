<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ian y Lu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A3B58">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ian y Lu">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#EEF0EA;
    --surface:#FFFFFF;
    --surface-2:#F7F8F3;
    --ink:#202824;
    --ink-soft:#5B655B;
    --line:#D9DCD0;
    --wine:#7A3B58;
    --wine-soft:#F3E7ED;
    --moss:#4F6B4A;
    --moss-soft:#E9EFE5;
    --gold:#B8873A;
    --good:#2F8F5B;
    --good-soft:#E4F2E9;
    --warn:#C99A3E;
    --warn-soft:#FBF1DE;
    --bad:#B4453A;
    --bad-soft:#FBE7E4;
    --shadow: 0 1px 2px rgba(32,40,36,.06), 0 6px 20px rgba(32,40,36,.06);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161B17;
      --surface:#1F2621;
      --surface-2:#242C25;
      --ink:#E9ECE5;
      --ink-soft:#A6AFA1;
      --line:#333B33;
      --wine:#D98FAE;
      --wine-soft:#3A2530;
      --moss:#8FB285;
      --moss-soft:#243024;
      --gold:#D9AE6F;
      --good:#7BC79A;
      --good-soft:#1E3126;
      --warn:#E0BB6E;
      --warn-soft:#3A311F;
      --bad:#E28579;
      --bad-soft:#3A2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161B17;
    --surface:#1F2621;
    --surface-2:#242C25;
    --ink:#E9ECE5;
    --ink-soft:#A6AFA1;
    --line:#333B33;
    --wine:#D98FAE;
    --wine-soft:#3A2530;
    --moss:#8FB285;
    --moss-soft:#243024;
    --gold:#D9AE6F;
    --good:#7BC79A;
    --good-soft:#1E3126;
    --warn:#E0BB6E;
    --warn-soft:#3A311F;
    --bad:#E28579;
    --bad-soft:#3A2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes checkPop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.15); } 100%{ transform:scale(1); } }
  @keyframes overlayFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalPop{ from{ opacity:0; transform:scale(.94) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--wine-soft); }
  :focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }

  #app{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px; flex:none;
    background:linear-gradient(155deg, var(--wine), var(--moss));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:17px;
  }
  .brand-name{ font-size:18px; }
  .brand-date{ font-size:11.5px; color:var(--ink-soft); text-transform:capitalize; }

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-soft); padding:0 10px; margin-bottom:2px; font-weight:600;
  }
  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    border:none; background:none; color:var(--ink); font-size:13.5px; cursor:pointer;
    text-align:left; width:100%; transition:background-color .15s ease, color .15s ease;
  }
  .nav-item:hover{ background:var(--surface-2); }
  .nav-item.active{ background:var(--moss-soft); color:var(--moss); font-weight:600; }
  .nav-group.shared .nav-item.active{ background:var(--wine-soft); color:var(--wine); }
  .nav-ico{ width:16px; text-align:center; font-size:14px; flex:none; }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .account-pill{
    border:1px solid var(--line); border-radius:11px; padding:8px 10px; background:var(--surface-2);
    font-size:12.5px; color:var(--ink-soft); text-align:center;
  }
  .account-pill strong{ color:var(--ink); }
  .settings-btn{
    border:1px solid var(--line); background:var(--surface-2); border-radius:9px; padding:8px 10px;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer; display:flex; gap:8px; align-items:center;
  }
  .settings-btn:hover{ color:var(--ink); }

  /* ---------- mobile top/bottom bars ---------- */
  .mobile-bar{ display:none; }
  .mobile-chips{ display:none; }

  /* ---------- main ---------- */
  main{ flex:1; min-width:0; padding:30px 34px 90px; max-width:920px; animation:fadeIn .22s ease; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .section-head h1{ font-size:26px; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin-top:3px; }
  .tag-shared, .tag-personal{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    padding:3px 9px; border-radius:20px;
  }
  .tag-shared{ background:var(--wine-soft); color:var(--wine); }
  .tag-personal{ background:var(--moss-soft); color:var(--moss); }

  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:border-color .15s ease, filter .15s ease, transform .1s ease;
  }
  .btn:hover{ border-color:var(--ink-soft); }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--wine); border-color:var(--wine); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.primary.moss{ background:var(--moss); border-color:var(--moss); }
  .btn.ghost{ border-color:transparent; background:none; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn.danger{ color:var(--bad); }

  .grid-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; }
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover{ transform:translateY(-2px); }
  .tile.tile-accent{ display:flex; align-items:center; gap:12px; }
  .tile-ico{
    width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }

  .hero{
    position:relative; overflow:hidden; border-radius:20px; padding:30px 28px; margin-bottom:22px;
    background:linear-gradient(135deg, #7A3B58 0%, #5c3a5a 45%, #4F6B4A 100%);
    color:#fff; box-shadow:var(--shadow);
  }
  .hero-content{ position:relative; z-index:1; }
  .hero-date{ font-size:12.5px; text-transform:capitalize; opacity:.85; margin-bottom:6px; }
  .hero h1{ font-size:30px; color:#fff; margin-bottom:6px; }
  .hero-sub{ font-size:14px; opacity:.92; max-width:420px; }
  .hero-blob{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.35; }
  .hero-blob.b1{ width:220px; height:220px; background:#fff; top:-90px; right:-60px; opacity:.12; }
  .hero-blob.b2{ width:140px; height:140px; background:#fff; bottom:-70px; right:80px; opacity:.10; }
  .tile-label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .tile-value{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; }
  .tile-value.good{ color:var(--good); } .tile-value.bad{ color:var(--bad); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;
  }
  .card h2{ font-size:16px; margin-bottom:10px; }

  .list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:flex-start; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .check{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line); flex:none; margin-top:2px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface); font-size:12px;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .check.on{ background:var(--moss); border-color:var(--moss); color:#fff; animation:checkPop .28s ease; }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:14px; font-weight:500; }
  .row-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .row-meta{ display:flex; gap:8px; align-items:center; margin-top:4px; flex-wrap:wrap; }
  .pill{
    font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;
  }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .avatar{
    width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:#fff;
  }
  .row-actions{ display:flex; gap:4px; flex:none; }
  .icon-btn{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:4px; border-radius:6px; font-size:13px;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

  .empty{ color:var(--ink-soft); font-size:13.5px; padding:18px 2px; text-align:center; }

  /* forms */
  .form{ display:flex; flex-direction:column; gap:10px; }
  .form-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13.5px; background:var(--surface);
    color:var(--ink); font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--wine); outline-offset:0; }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:2px; }

  /* finance ledger */
  .ledger-row{
    display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px dashed var(--line);
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-desc{ flex:1; min-width:0; }
  .ledger-desc .cat{ font-size:11px; color:var(--ink-soft); }
  .ledger-amt{ font-size:14px; font-weight:600; }
  .ledger-amt.in{ color:var(--good); } .ledger-amt.out{ color:var(--bad); }
  .chip-mini{
    font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border-radius:8px; padding:1px 6px; vertical-align:middle;
  }
  .sheet-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:16px;
  }
  .bars{ display:flex; flex-direction:column; gap:8px; }
  .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .bar-label{ width:96px; flex:none; color:var(--ink-soft); }
  .bar-track{ flex:1; height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--wine); border-radius:6px; }
  .bar-val{ width:56px; text-align:right; flex:none; font-family:'IBM Plex Mono',monospace; }

  /* calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .cal-dow{ text-align:center; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:1; border-radius:9px; background:var(--surface-2); display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:12.5px; gap:3px; position:relative;
    cursor:pointer; transition:background-color .15s ease, transform .1s ease;
  }
  .cal-cell:hover{ background:var(--moss-soft); }
  .cal-cell:active{ transform:scale(.94); }
  .cal-cell.today{ background:var(--wine); color:#fff; font-weight:700; }
  .cal-cell.today:hover{ background:var(--wine); filter:brightness(1.08); }
  .cal-cell.empty{ background:none; cursor:default; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--moss); }
  .cal-cell.today .cal-dot{ background:#fff; }

  /* goals */
  .goal-progress{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin:8px 0; }
  .goal-progress-fill{ height:100%; background:var(--wine); }

  /* clients table */
  .ink-soft{ color:var(--ink-soft); }
  .client-row{
    display:grid; grid-template-columns:26px 1.4fr .95fr .9fr 1fr .8fr .7fr 30px; gap:10px; align-items:center;
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px;
  }
  .client-row:last-child{ border-bottom:none; }
  .client-row:hover{ background:var(--surface-2); }
  .client-row-head{ cursor:default; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); }
  .client-row-head:hover{ background:var(--surface-2); }
  .cr-sortable{ cursor:pointer; user-select:none; }
  .cr-sortable:hover{ color:var(--ink); }
  .cr-name{ font-weight:600; }
  .cr-sub{ color:var(--ink-soft); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cr-bad{ color:var(--bad); font-weight:600; }
  .cr-warn{ color:var(--warn); font-weight:600; }
  .cr-phone a{ color:var(--wine); text-decoration:none; font-size:12.5px; }
  .cr-phone a:hover{ text-decoration:underline; }
  .client-bulk-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:13px; }
  @media (max-width:720px){ .cr-hide-sm{ display:none; } .client-row{ grid-template-columns:26px 1.4fr .95fr .9fr 30px; } }

  /* AI assistant */
  .ai-chat{ display:flex; flex-direction:column; gap:10px; max-height:360px; overflow-y:auto; }
  .ai-msg{ padding:10px 14px; border-radius:12px; max-width:80%; }
  .ai-msg.user{ background:var(--wine-soft); align-self:flex-end; }
  .ai-msg.assistant{ background:var(--surface-2); align-self:flex-start; }
  .ai-msg-role{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:3px; }
  .ai-msg-text{ font-size:13.5px; white-space:pre-wrap; line-height:1.5; }

  /* notes */
  .notes-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .note-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
  .note-card h3{ font-size:14px; margin-bottom:6px; font-family:'Fraunces',serif; }
  .note-card p{ font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap; margin:0; }

  /* messages */
  .msg-feed{ display:flex; flex-direction:column; gap:12px; max-width:640px; }
  .msg-bubble{
    position:relative; padding:14px 40px 14px 16px; border-radius:16px; box-shadow:var(--shadow);
    border:1px solid var(--line); background:var(--surface);
  }
  .msg-bubble.mine{ background:var(--wine-soft); border-color:var(--wine); align-self:flex-end; }
  .msg-bubble.theirs{ align-self:flex-start; }
  .msg-meta{ display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .msg-meta strong{ color:var(--wine); font-family:'Fraunces',serif; font-size:13px; }
  .msg-text{ font-size:14px; white-space:pre-wrap; line-height:1.5; }
  .msg-del{ position:absolute; top:8px; right:8px; opacity:.5; }
  .msg-del:hover{ opacity:1; }

  /* running */
  .run-compare{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px; }
  .run-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .run-card.run-lead{ box-shadow:0 0 0 2px var(--good) inset, var(--shadow); }
  .run-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; font-family:'Fraunces',serif; font-size:15px; }
  .run-stat-row{ display:flex; justify-content:space-between; gap:8px; text-align:left; }
  .run-stat-val{ font-size:17px; font-weight:700; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px; animation:overlayFade .16s ease;
  }
  .modal{
    background:var(--surface); border-radius:16px; padding:22px; width:100%; max-width:420px; box-shadow:var(--shadow);
    max-height:86vh; overflow-y:auto; animation:modalPop .2s cubic-bezier(.25,.9,.35,1.15);
  }
  .modal h2{ font-size:18px; margin-bottom:14px; }

  /* who-are-you chooser */
  .chooser{
    position:fixed; inset:0; background:var(--paper); z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; text-align:center; padding:20px;
  }
  .chooser h1{ font-size:30px; }
  .chooser p{ color:var(--ink-soft); max-width:360px; }
  .chooser-btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .chooser-btn{
    border:1.5px solid var(--line); background:var(--surface); border-radius:16px; padding:22px 30px;
    font-family:'Fraunces',serif; font-size:19px; font-weight:600; cursor:pointer; min-width:150px;
    box-shadow:var(--shadow); transition:border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .chooser-btn:hover{ border-color:var(--wine); color:var(--wine); }
  .chooser-btn:active{ transform:scale(.97); }

  .sync-note{ font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; padding:0 6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }
  .dot.off{ background:var(--warn); }
  .dot.bad{ background:var(--bad); }
  .banner{
    background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:9px 14px; font-size:12.5px;
    margin-bottom:18px;
  }
  .banner.bad{ background:var(--bad-soft); color:var(--bad); }
  .tile.clickable{ cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .tile.clickable:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .line-chart{ display:block; margin-top:4px; }
  .reminder-card{ border-left:4px solid var(--warn); }
  .reminder-card.has-overdue{ border-left-color:var(--bad); }
  .reminder-card h2{ display:flex; align-items:center; gap:8px; }

  .chart-row{ display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
  .chart-row .bars{ flex:1; min-width:180px; }
  .donut{ flex:none; }

  @media (max-width:860px){

  /* ---------------- planilla de gastos (Google Sheets) ---------------- */
  function stripAccents(s){
    return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  }

  function parseCsv(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n' || c === '\r'){
          if(c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = "";
          rows.push(row); row = [];
        } else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length > 1 || (r.length===1 && r[0] !== ""); });
  }

  function parseSheetDate(raw){
    raw = String(raw||"").trim();
    if(!raw) return "";
    var iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(iso) return iso[1]+"-"+iso[2].padStart(2,"0")+"-"+iso[3].padStart(2,"0");
    var dmy = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(dmy){
      var y = dmy[3].length===2 ? "20"+dmy[3] : dmy[3];
      return y+"-"+dmy[2].padStart(2,"0")+"-"+dmy[1].padStart(2,"0");
    }
    return "";
  }

  function parseSheetAmount(raw){
    var s = String(raw||"").trim();
    if(!s) return NaN;
    var neg = /^-/.test(s) || /^\(.*\)$/.test(s);
    s = s.replace(/[^0-9.,-]/g,"");
    if(s.indexOf(",") !== -1 && s.indexOf(".") !== -1){
      s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
    } else if(s.indexOf(",") !== -1){
      s = s.replace(",", ".");
    }
    var n = parseFloat(s);
    if(isNaN(n)) return NaN;
    return neg ? -Math.abs(n) : n;
  }

  function rowsToTx(rows){
    if(!rows.length) return [];
    var header = rows[0].map(stripAccents);
    var idx = {
      fecha: header.findIndex(function(h){ return /^(fecha|date)$/.test(h); }),
      desc: header.findIndex(function(h){ return /^(descripcion|desc|concepto|description)$/.test(h); }),
      categoria: header.findIndex(function(h){ return /^(categoria|category|rubro)$/.test(h); }),
      tipo: header.findIndex(function(h){ return /^(tipo|type)$/.test(h); }),
      monto: header.findIndex(function(h){ return /^(monto|amount|importe|total)$/.test(h); })
    };
    if(idx.monto === -1 || idx.fecha === -1) return [];
    var out = [];
    for(var i=1; i<rows.length; i++){
      var r = rows[i];
      var date = parseSheetDate(r[idx.fecha]);
      var amountRaw = parseSheetAmount(r[idx.monto]);
      if(!date || isNaN(amountRaw) || amountRaw === 0) continue;
      var tipoRaw = idx.tipo !== -1 ? stripAccents(r[idx.tipo]) : "";
      var type = /ingreso|income/.test(tipoRaw) ? "ingreso" : (/gasto|expense/.test(tipoRaw) ? "gasto" : (amountRaw < 0 ? "gasto" : "ingreso"));
      out.push({
        id: "sheet-" + i + "-" + date + "-" + Math.round(Math.abs(amountRaw)*100),
        desc: (idx.desc !== -1 ? r[idx.desc] : "") || "Movimiento de planilla",
        amount: Math.abs(amountRaw),
        type: type,
        category: (idx.categoria !== -1 ? r[idx.categoria] : "") || "Otro",
        date: date,
        source: "sheet"
      });
    }
    return out;
  }

  async function fetchSheetTx(){
    var url = appState.config.sheetCsvUrl;

      var text = await res.text();

      sheetSyncStatus = "ok";
      sheetLastSync = new Date();
    }catch(e){
      sheetSyncStatus = "error";

    syncDataView();
    render();

  function recordQuoteHistory(kind, key, value){
    if(!value && value !== 0) return;
    var bucket = appState.quoteHistory[kind];
    if(!bucket) return;
    var list = bucket[key] || (bucket[key] = []);
    var today = todayISO();
    if(list.length && list[list.length-1].date === today){
      list[list.length-1].value = value;
    } else {
      list.push({ date: today, value: value });
    }
    if(list.length > 180) list.splice(0, list.length - 180);
  }

  async function fetchStockQuotes(){
    var apiKey = appState.config.finnhubApiKey;
    var tickers = tickerList();
    if(!apiKey || !tickers.length){ stockStatus = "no-config"; stockFetched = true; render(); return; }
    stockStatus = "loading";
    render();
    try{
      var results = await Promise.all(tickers.map(async function(sym){
        var res = await fetch("https://finnhub.io/api/v1/quote?symbol=" + encodeURIComponent(sym) + "&token=" + encodeURIComponent(apiKey));
        if(!res.ok) throw new Error("bad status");
        var q = await res.json();
        return { sym: sym, q: q };
      }));
      var next = {};
      var alerts = [];
      var thresholdPct = Number(appState.config.alertDropPct) || 3;
      results.forEach(function(r){
        next[r.sym] = r.q;
        var price = r.q && r.q.c;
        if(!price) return;
        var history = appState.quoteHistory.stocks[r.sym] || [];
        var prevPoint = history.length ? history[history.length-1] : null;
        var comparablePrev = prevPoint ? prevPoint.value : null;
        if(comparablePrev){
          var pctChange = ((price - comparablePrev) / comparablePrev) * 100;
          if(pctChange <= -thresholdPct){
            alerts.push({ sym: r.sym, pct: pctChange, price: price });
            notifyStockDrop(r.sym, Math.abs(pctChange), price);
          }
        }
        recordQuoteHistory("stocks", r.sym, price);
      });
      stockQuotes = next;
      stockAlerts = alerts;
      stockStatus = "ok";
      stockLastSync = new Date();
      persist();
    }catch(e){
      stockStatus = "error";
    }
    stockFetched = true;
    render();
  }

      },

      var errText = "";
      try{ errText = (await res.json()).error.message; }catch(e){}

    var text = (data.content || []).map(function(b){ return b.text || ""; }).join("\n").trim();
    return text || "(sin respuesta)";

  function subscribeRealtime(){
    try{
      realtimeChannel = supabase.channel("app_state_sync")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "app_state", filter: "id=eq." + ROW_ID }, function(payload){
          appState = normalizeState((payload.new && payload.new.data) || {});
          syncDataView();
          render();
        })
        .subscribe(function(status){
          if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
            if(syncStatus === "ok"){ syncStatus = "error"; render(); }
          }
        });
    }catch(e){ /* realtime optional; polling fallback not implemented, writes still work */ }
  }

  // genera la tarea compartida de hoy para cada plantilla recurrente, si todavía no se generó
  function applyRecurringTasks(){
    var today = todayISO();
    var todayDow = (new Date(today+"T00:00:00").getDay()+6)%7; // Lunes=0 ... Domingo=6, igual que DOWS
    var changed = false;
    appState.recurringTasks.forEach(function(tpl){
      if(tpl.repeat === "weekly" && tpl.weekday !== todayDow) return;
      var expectedId = "rectask-" + tpl.id + "-" + today;
      var exists = appState.sharedTasks.some(function(t){ return t.id === expectedId; });
      if(!exists){
        appState.sharedTasks.push({ id: expectedId, title: tpl.title, done:false, dueDate: today, createdBy: "auto", createdAt: Date.now(), assignedTo: tpl.assignedTo||null, recurringId: tpl.id });

  // ¿esta evento (posiblemente anual) cae en esta fecha puntual?
  function eventOccursOn(e, dateStr){
    if(!e.date) return false;
    if(e.date === dateStr) return true;
    if(e.recurring && e.date.slice(5,10) === dateStr.slice(5,10) && dateStr.slice(0,4) > e.date.slice(0,4)) return true;
    return false;
  }
  // próxima fecha (hoy o futura) en la que cae este evento, considerando los que se repiten cada año
  function nextOccurrenceDate(e){
    if(!e.date) return null;
    if(!e.recurring) return e.date >= todayISO() ? e.date : null;
    var todayY = Number(todayISO().slice(0,4));
    var monthDay = e.date.slice(5,10);
    var thisYear = todayY + "-" + monthDay;
    return thisYear >= todayISO() ? thisYear : ((todayY+1) + "-" + monthDay);
  }

      var ws = workbook.Sheets[sheetName];
      if(!ws) return;
      var rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
      var headerIdx = -1;
      for(var i=0;i<Math.min(rows.length,15);i++){
        var idx = findCol(rows[i]||[], function(h){ return h.indexOf("nombre") !== -1; });
        if(idx !== -1){ headerIdx = i; break; }
      }
      if(headerIdx === -1) return;
      sheets.push({ name:sheetName, rows:rows, headerIdx:headerIdx });
      // use the widest header row we find as the reference for the mapping UI
      if((rows[headerIdx]||[]).length > headerLen){ headerLen = rows[headerIdx].length; headerRow = rows[headerIdx]; }
    });
    return { sheets:sheets, headerRow:headerRow };
  }
  function extractClientRows(sheets, col){
    var out = [];
    sheets.forEach(function(sheet){
      for(var r=sheet.headerIdx+1; r<sheet.rows.length; r++){
        var row = sheet.rows[r];
        if(!row) continue;
        var name = col.name > -1 ? row[col.name] : null;
        if(!name || !String(name).trim()) continue;
        out.push({
          name: String(name).trim(),
          email: col.email > -1 && row[col.email] ? String(row[col.email]).trim() : "",
          phone: col.phone > -1 && row[col.phone] !== null && row[col.phone] !== undefined && row[col.phone] !== "" ? String(row[col.phone]).trim() : "",
          stage: normalizeStageFromImport(col.stage > -1 ? row[col.stage] : ""),
          firstContactDate: col.firstContactDate > -1 ? excelDateToISO(row[col.firstContactDate]) : null,
          nextAction: col.nextAction > -1 && row[col.nextAction] ? String(row[col.nextAction]).trim() : "",
          lastUpdateDate: col.lastUpdateDate > -1 ? excelDateToISO(row[col.lastUpdateDate]) : null,
          potentialValue: col.potentialValue > -1 && row[col.potentialValue] !== null && row[col.potentialValue] !== "" ? Number(row[col.potentialValue]) : null,
          responsible: col.responsible > -1 && row[col.responsible] ? String(row[col.responsible]).trim() : "Ian",
          recontactDate: col.recontactDate > -1 ? excelDateToISO(row[col.recontactDate]) : null,
          isInvestor: col.isInvestor > -1 ? /^s/i.test(String(row[col.isInvestor]||"").trim()) : false,
          comment: col.comment > -1 && row[col.comment] ? String(row[col.comment]).trim() : ""
        });
      }
    });
    return out;
  }
  function normalizePhoneKey(p){
    var digits = String(p||"").replace(/[^0-9]/g,"");
    return digits.length >= 6 ? digits.slice(-8) : null; // últimos 8 dígitos: tolera prefijos de país/área distintos
  }
  function mergeImportedClients(list){
    var clients = appState.personal.ian.clients;
    var added = 0, updated = 0;
    list.forEach(function(rec){
      var emailKey = rec.email ? rec.email.toLowerCase() : null;
      var phoneKey = normalizePhoneKey(rec.phone);
      var existing = clients.find(function(c){
        if(emailKey && c.email && c.email.toLowerCase() === emailKey) return true;
        if(phoneKey && normalizePhoneKey(c.phone) === phoneKey) return true;
        if(!emailKey && !phoneKey && !c.email && !c.phone) return c.name.trim().toLowerCase() === rec.name.trim().toLowerCase();
        return false;
      });
      var comment = rec.comment;
      delete rec.comment;
      if(existing){
        Object.assign(existing, rec);
        if(comment){
          existing.comments = existing.comments || [];
          var already = existing.comments.some(function(cm){ return cm.text === comment; });
          if(!already) existing.comments.push({ id: uid(), text: comment, date: Date.now(), by: "import" });
        }
        updated++;
      } else {
        rec.id = uid();
        rec.createdAt = Date.now();
        rec.comments = comment ? [{ id: uid(), text: comment, date: Date.now(), by: "import" }] : [];
        clients.unshift(rec);
        added++;
      }
    });
    persist();
    return { added: added, updated: updated };
  }
  async function handleClientImportFile(file){
    if(!file || typeof XLSX === "undefined") return;
    try{
      var buf = await file.arrayBuffer();
      var wb = XLSX.read(buf, { type:"array", cellDates:true });
      var scan = scanWorkbookHeaders(wb);
      if(!scan.sheets.length || !scan.headerRow){
        clientImportMsg = { ok:false, text:"No encontré una fila de encabezados con 'Nombre del cliente' en el archivo." };
        render();
        return;
      }
      pendingImport = { sheets: scan.sheets, headerRow: scan.headerRow, colMap: guessColumnMap(scan.headerRow) };
      state.modal = "import-map";
      render();
    }catch(e){
      clientImportMsg = { ok:false, text:"No se pudo leer el archivo. Probá con el Excel original sin editar." };
      render();
    }
  }

  function dueClass(dueDate, done){
    if(done || !dueDate) return "neutral";
    if(dueDate < todayISO()) return "bad";
    if(dueDate === todayISO()) return "warn";
    return "neutral";
  }
  function dueLabel(dueDate, done){
    if(!dueDate) return null;
    if(done) return fmtDate(dueDate);
    if(dueDate < todayISO()) return "Venció " + fmtDate(dueDate);
    if(dueDate === todayISO()) return "Hoy";
    return fmtDate(dueDate);
  }

  function expenseDonutSvg(byCat, cats, total){
    if(!total || !cats.length) return "";
    var r = 52, cx = 60, cy = 60, circ = 2 * Math.PI * r;
    var offset = 0;
    var segs = cats.map(function(c){
      var v = byCat[c];
      var frac = v / total;
      var dash = frac * circ;
      var colorIdx = FIN_CATS.indexOf(c);
      if(colorIdx < 0) colorIdx = 0;
      var s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var('+CAT_VARS[colorIdx % CAT_VARS.length]+')" ' +
        'stroke-width="16" stroke-dasharray="'+dash.toFixed(2)+' '+(circ - dash).toFixed(2)+'" ' +
        'stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
      offset += dash;
      return s;
    }).join("");
    return '<svg viewBox="0 0 120 120" class="donut" width="140" height="140">' + segs +
      '<text x="60" y="56" text-anchor="middle" fill="var(--ink)" font-family="IBM Plex Mono, monospace" font-size="12">' + fmtMoney(total) + '</text>' +
      '<text x="60" y="72" text-anchor="middle" fill="var(--ink-soft)" font-size="9">este mes</text>' +
      '</svg>';
  }

  function svgLineChart(points, opts){
    opts = opts || {};
    var w = opts.width || 320, h = opts.height || 120, pad = 10;
    if(!points || points.length < 2){
      return '<div class="empty">Todavía no hay suficiente historial para graficar.</div>';
    }
    var values = points.map(function(p){ return p.value; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if(min === max){ min -= 1; max += 1; }
    var stepX = (w - pad*2) / (points.length - 1);
    var coords = points.map(function(p, i){
      var x = pad + i * stepX;
      var y = pad + (1 - (p.value - min) / (max - min)) * (h - pad*2);
      return [x, y];
    });
    var pathD = coords.map(function(c, i){ return (i===0?"M":"L") + c[0].toFixed(1) + " " + c[1].toFixed(1); }).join(" ");
    var areaD = pathD + " L" + coords[coords.length-1][0].toFixed(1) + " " + (h-pad) + " L" + coords[0][0].toFixed(1) + " " + (h-pad) + " Z";
    var up = values[values.length-1] >= values[0];
    var color = up ? "var(--good)" : "var(--bad)";
    var lastPoint = coords[coords.length-1];
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" class="line-chart">' +
      '<path d="'+areaD+'" fill="'+color+'" opacity="0.12" stroke="none"></path>' +
      '<path d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>' +
      '<circle cx="'+lastPoint[0].toFixed(1)+'" cy="'+lastPoint[1].toFixed(1)+'" r="3.5" fill="'+color+'"></circle>' +
      '</svg>';
  }

  function computeCatBreakdown(){
    var now = new Date();
    var monthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    var byCat = {};
    var totalExpense = 0;
    state.data.financeTx.forEach(function(t){
      if(t.type==="gasto" && (t.date||"").slice(0,7)===monthKey){
        byCat[t.category] = (byCat[t.category]||0) + Number(t.amount||0);
        totalExpense += Number(t.amount||0);
      }
    });
    var cats = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
    return { byCat: byCat, cats: cats, total: totalExpense };
  }

      items.push({ time: e.hora || null, label: e.title + (e.recurring?" 🎂":""), meta: escapeHtml(EVENT_CATS[e.category]||"Otro") + (e.notes ? " · "+escapeHtml(e.notes) : ""), kind: "evento" });
    });
    state.data.sharedTasks.filter(function(t){ return t.dueDate === dateStr && !t.done; }).forEach(function(t){
      items.push({ time: null, label: t.title, meta: "Tarea compartida", kind: "tarea" });
    });
    if(state.role){
      state.data.myTasks.filter(function(t){ return t.dueDate === dateStr && !t.done; }).forEach(function(t){
        items.push({ time: null, label: t.title, meta: "Tu tarea personal", kind: "tarea" });
      });
    }
    items.sort(function(a,b){
      if(a.time && b.time) return a.time.localeCompare(b.time);
      if(a.time) return -1;
      if(b.time) return 1;
      return 0;
    });
    var list = items.length ? items.map(function(it){
      return '<div class="row"><div class="row-body"><div class="row-title">'+(it.time?'<span class="mono" style="color:var(--wine)">'+it.time+'</span> · ':'')+escapeHtml(it.label)+'</div>' +
        '<div class="row-meta"><span class="pill neutral">'+it.meta+'</span></div></div></div>';
    }).join("") : '<div class="empty">Nada agendado este día.</div>';
    return '<h2>'+d.toLocaleDateString("es-AR",{weekday:"long", day:"numeric", month:"long"})+'</h2>' +
      '<div class="list" style="margin:12px 0">' + list + '</div>' +
      '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cerrar</button>' +
      '<button type="button" class="btn primary" onclick="NV.openModal(\'event\',\''+dateStr+'\')">+ Evento este día</button></div>';
  }

  function sectionCalendar(){
    var now = new Date();
    var viewMonth = state.calendarMonth || todayISO().slice(0,7);
    var y = Number(viewMonth.slice(0,4)), m = Number(viewMonth.slice(5,7)) - 1;
    var isCurrentMonth = viewMonth === todayISO().slice(0,7);
    var first = new Date(y,m,1);
    var startDow = (first.getDay()+6)%7;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var eventsByDay = {};
    for(var d=1; d<=daysInMonth; d++){
      var cellDateChk = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      var count = state.data.events.filter(function(e){ return eventOccursOn(e, cellDateChk); }).length;
      if(count) eventsByDay[d] = count;
    }
    var cells = [];
    for(var i=0;i<startDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(var d=1; d<=daysInMonth; d++){
      var isToday = isCurrentMonth && d === now.getDate();
      var cellDate = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      cells.push('<div class="cal-cell '+(isToday?'today':'')+'" onclick="NV.openDay(\''+cellDate+'\')">'+d+ (eventsByDay[d] ? '<span class="cal-dot"></span>' : '') +'</div>');
    }
    var upcoming = upcomingEvents();
    return (
      '<div class="section-head"><div><h1>Calendario <span class="tag-shared">Compartido</span></h1><div class="section-sub">tocá un día para ver el detalle</div></div>' +
      '<button class="btn primary" onclick="NV.openModal(\'event\')">+ Evento</button></div>' +
      '<div class="card">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
        '<button class="btn ghost small" onclick="NV.calendarNav(-1)">‹ Anterior</button>' +
        '<div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0;text-transform:capitalize">'+MONTHS[m]+' de '+y+'</h2>' +
        (isCurrentMonth ? '' : '<button class="btn ghost small cal-today-btn" onclick="NV.calendarToday()">Hoy</button>') + '</div>' +
        '<button class="btn ghost small" onclick="NV.calendarNav(1)">Siguiente ›</button>' +
      '</div>' +
      '<div class="cal-grid">' + DOWS.map(function(dw){return '<div class="cal-dow">'+dw+'</div>';}).join("") + cells.join("") + '</div></div>' +
      '<div class="card"><h2>Próximos eventos</h2><div class="list">' +
      (upcoming.length ? upcoming.map(function(e){
        return '<div class="row"><div class="row-body"><div class="row-title">'+escapeHtml(e.title)+(e.recurring?' 🎂':'')+'</div>' +
          '<div class="row-meta"><span class="pill neutral">'+fmtDate(e._nextDate)+(e.hora?' · '+e.hora:'')+'</span><span class="pill neutral">'+escapeHtml(EVENT_CATS[e.category]||"Otro")+'</span>'+(e.recurring?'<span class="pill neutral">Todos los años</span>':'')+'</div>' +
          (e.notes ? '<div class="section-sub" style="margin-top:4px">'+escapeHtml(e.notes)+'</div>' : '') +
          '</div><div class="row-actions"><button class="icon-btn" aria-label="Eliminar" onclick="NV.deleteItem(\'events\',\''+e.id+'\')">✕</button></div></div>';
      }).join("") : '<div class="empty">No hay eventos próximos.</div>') +
      '</div></div>'
    );
  }

  function sectionRunning(){
    var monthKey = todayISO().slice(0,7);
    var lastMonthKey = monthsAgoKey(1);
    var roles = ["ian","partner"];
    var stats = {};
    roles.forEach(function(r){
      stats[r] = { now: runningStatsFor(r, monthKey), prev: runningStatsFor(r, lastMonthKey) };
    });
    function paceDelta(r){
      var a = stats[r].now.avgPace, b = stats[r].prev.avgPace;
      if(a === null || b === null) return null;
      return a - b; // negative = faster = improved
    }
    var deltas = {}; roles.forEach(function(r){ deltas[r] = paceDelta(r); });
    var comparable = roles.filter(function(r){ return deltas[r] !== null; });
    var improver = comparable.length ? comparable.reduce(function(best,r){ return (best===null || deltas[r] < deltas[best]) ? r : best; }, null) : null;

    function roleCard(r){
      var s = stats[r].now;
      var d = deltas[r];
      var isImprover = improver === r && comparable.length > 1;
      return '<div class="run-card'+(isImprover?' run-lead':'')+'" style="border-left:4px solid '+ROLE_COLORS[r]+'">' +
        '<div class="run-card-head"><span class="avatar" style="background:'+ROLE_COLORS[r]+'">'+roleInitial(r)+'</span><strong>'+escapeHtml(roleName(r))+'</strong>' +
        (isImprover?'<span class="pill good" style="margin-left:auto">🏆 Mejoró más</span>':'') +
        '</div>' +
        '<div class="run-stat-row"><div><div class="run-stat-val mono">'+s.km.toFixed(1)+' km</div><div class="section-sub">este mes</div></div>' +
        '<div><div class="run-stat-val mono">'+s.count+'</div><div class="section-sub">salidas</div></div>' +
        '<div><div class="run-stat-val mono">'+fmtPace(s.avgPace)+'</div><div class="section-sub">ritmo promedio</div></div></div>' +
        (d !== null ? '<div class="'+(d<=0?'good':'bad')+'" style="font-size:12.5px;font-weight:600;margin-top:8px">'+(d<=0?'▼':'▲')+' '+fmtPace(Math.abs(d)).replace(" /km","")+' /km vs mes pasado</div>' : '<div class="section-sub" style="margin-top:8px">Todavía no hay datos del mes pasado para comparar.</div>') +
        '</div>';
    }

    var log = state.data.running.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.createdAt - a.createdAt; });

    return (
      '<div class="section-head"><div><h1>Running <span class="tag-shared">Compartido</span></h1><div class="section-sub">Cada uno carga sus salidas — a ver quién mejora más.</div></div>' +
      '<button class="btn primary" onclick="NV.openModal(\'run\')">+ Salida</button></div>' +
      '<div class="run-compare">' + roles.map(roleCard).join("") + '</div>' +
      '<div class="card"><h2>Historial</h2><div class="list">' +
      (log.length ? log.map(function(r){
        return '<div class="row"><div class="row-body">' +
          '<div class="row-title"><span class="avatar" style="background:'+ROLE_COLORS[r.role]+';width:20px;height:20px;font-size:10px;margin-right:6px">'+roleInitial(r.role)+'</span>' +
          r.distanceKm.toFixed(1)+' km en '+r.durationMin+' min <span class="mono" style="color:var(--ink-soft);margin-left:6px">('+fmtPace(r.durationMin/r.distanceKm)+')</span></div>' +
          '<div class="row-meta"><span class="pill neutral">'+fmtDate(r.date)+'</span>'+(r.notes?'<span class="section-sub">'+escapeHtml(r.notes)+'</span>':'')+'</div>' +
          '</div><div class="row-actions"><button class="icon-btn" aria-label="Eliminar" onclick="NV.deleteItem(\'running\',\''+r.id+'\')">✕</button></div></div>';
      }).join("") : '<div class="empty">Todavía no cargaron ninguna salida.</div>') +
      '</div></div>'
    );
  }

  function sortClients(list, sort){
    var key = sort.key || "name";
    var dir = sort.dir === "desc" ? -1 : 1;
    return list.slice().sort(function(a,b){
      var av, bv;
      if(key === "phone"){ av = a.phone||""; bv = b.phone||""; }
      else if(key === "stage"){ av = stageMeta(a.stage).label; bv = stageMeta(b.stage).label; }
      else if(key === "nextAction"){ av = a.nextAction||""; bv = b.nextAction||""; }
      else if(key === "recontactDate"){ av = a.recontactDate||"9999-99-99"; bv = b.recontactDate||"9999-99-99"; }
      else if(key === "potentialValue"){ av = a.potentialValue||0; bv = b.potentialValue||0; }
      else { av = stripAccents(a.name||""); bv = stripAccents(b.name||""); }
      if(av < bv) return -1*dir;
      if(av > bv) return 1*dir;
      return 0;
    });
  }
  function sortArrow(key){
    if(state.clientSort.key !== key) return "";
    return state.clientSort.dir === "asc" ? " ▲" : " ▼";
  }

  function sectionContactHoy(){

    var soonLimit = addDaysISO(todayS, 3);
    var due = state.data.myClients.filter(function(c){ return c.recontactDate && c.recontactDate <= todayS; })

        '<div class="field"><label>Duración (min)</label><input type="number" step="0.1" name="durationMin" required placeholder="Ej: 32.5"></div>' +
        '</div>' +
        '<div class="field"><label>Fecha</label><input type="date" name="date" value="'+todayISO()+'"></div>' +
        '<div class="field"><label>Notas (opcional)</label><textarea name="notes" placeholder="Cómo te sentiste, el circuito, etc."></textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "quote-history"){
      content = quoteHistoryHtml();
    } else if(state.modal === "settings"){
      content = '<h2>Configuración</h2><form class="form" onsubmit="NV.submitConfig(event)">' +
        '<div class="field"><label>Nombre de Ian</label><input name="ianName" value="'+escapeHtml(appState.config.names.ian)+'"></div>' +
        '<div class="field"><label>Nombre de tu pareja</label><input name="partnerName" value="'+escapeHtml(appState.config.names.partner)+'"></div>' +
        '<div class="field"><label>Símbolo de moneda</label><input name="currency" value="'+escapeHtml(appState.config.currency)+'" style="max-width:80px"></div>' +
        '<div class="field"><label>Planilla de gastos (Google Sheets, opcional)</label>' +
          '<input name="sheetCsvUrl" value="'+escapeHtml(appState.config.sheetCsvUrl)+'" placeholder="Pegá acá el link CSV publicado">' +
          '<div class="section-sub" style="margin-top:4px">En tu planilla: Archivo → Compartir → Publicar en la Web → elegí la hoja → formato CSV → copiá ese link (no el link normal de compartir).</div>' +
        '</div>' +
        '<div class="field"><label>Clave de Finnhub (opcional, para ver acciones)</label>' +
          '<input name="finnhubApiKey" value="'+escapeHtml(appState.config.finnhubApiKey)+'" placeholder="Tu API key de finnhub.io">' +
          '<div class="section-sub" style="margin-top:4px">Gratis en finnhub.io → registrate → Dashboard → copiá la "API key".</div>' +
        '</div>' +
        '<div class="field"><label>Acciones a seguir (tickers separados por coma)</label>' +
          '<input name="stockTickers" value="'+escapeHtml(appState.config.stockTickers)+'" placeholder="Ej: AAPL, GGAL, MELI, TSLA">' +
        '</div>' +
        '<div class="form-row">' +
        '<div class="field" style="display:flex;align-items:center;gap:8px;flex-direction:row"><input type="checkbox" name="notifyStockDrops" style="width:auto" '+(appState.config.notifyStockDrops?'checked':'')+'><label style="margin:0">Avisarme cuando una acción baja</label></div>' +
        '<div class="field"><label>Umbral de baja (%)</label><input type="number" step="0.5" min="0.5" name="alertDropPct" value="'+escapeHtml(String(appState.config.alertDropPct))+'" style="max-width:100px"></div>' +
        '</div>' +
        '<div class="section-sub" style="margin-top:-6px;margin-bottom:2px">El aviso aparece como notificación del navegador — solo funciona mientras tengas la app abierta en una pestaña.</div>' +
        '<div class="form-row">' +
        '<div class="field"><label>Tema</label><select name="themeMode">' +
          ['system','light','dark'].map(function(m){
            var lbl = m==="system"?"Automático (según tu dispositivo)":m==="light"?"Claro":"Oscuro";
            return '<option value="'+m+'"'+(appState.config.themeMode===m?' selected':'')+'>'+lbl+'</option>';
          }).join("") +
        '</select></div>' +
        '<div class="field"><label>Paleta de color</label><select name="accentTheme">' +
          Object.keys(ACCENT_THEMES).map(function(k){
            return '<option value="'+k+'"'+(appState.config.accentTheme===k?' selected':'')+'>'+ACCENT_THEMES[k].label+'</option>';
          }).join("") +
        '</select></div>' +
        '</div>' +
        '<div class="field"><label>Clave de la API de Anthropic (opcional, para el Asistente)</label>' +
          '<input name="aiApiKey" value="'+escapeHtml(appState.config.aiApiKey)+'" placeholder="sk-ant-...">' +
          '<div class="section-sub" style="margin-top:4px">Se genera en console.anthropic.com → API Keys.</div>' +
        '</div>' +
        '<div class="field"><label>Modelo de IA</label>' +
          '<input name="aiModel" value="'+escapeHtml(appState.config.aiModel)+'" placeholder="Ej: claude-haiku-4-5-20251001">' +
          '<div class="section-sub" style="margin-top:4px">Revisá el nombre exacto del modelo que quieras usar en la documentación de Anthropic.</div>' +
        '</div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>' +
        '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)"><button type="button" class="btn ghost" onclick="NV.logout()" style="width:100%">⎋ Cerrar sesión</button></div>';
    }
    return '<div class="overlay" onclick="if(event.target===this) NV.closeModal()"><div class="modal">'+content+'</div></div>';
  }

  function loginHtml(errorMsg){
    return '<div class="chooser">' +
      '<div><div class="brand-mark" style="margin:0 auto 16px;width:52px;height:52px;font-size:24px">IL</div>' +
      '<h1>Ian y Lu</h1><p>Iniciá sesión para entrar al espacio compartido.</p></div>' +
      (errorMsg ? '<div class="banner" style="max-width:300px">'+escapeHtml(errorMsg)+'</div>' : '') +
      '<form onsubmit="NV.doLogin(event)" style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px">' +
        '<input id="login-email" type="email" placeholder="Email" required autocomplete="username" ' +
          'style="padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;width:100%;box-sizing:border-box">' +
        '<input id="login-pass" type="password" placeholder="Contraseña" required autocomplete="current-password" ' +
          'style="padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;width:100%;box-sizing:border-box">' +
        '<button type="submit" class="chooser-btn" id="login-btn" style="border-color:var(--wine);color:var(--wine);width:100%">Entrar</button>' +
      '</form>' +
    '</div>';
  }

  function showLoginScreen(errorMsg){
    var app = document.getElementById("app");
    app.innerHTML = loginHtml(errorMsg);
  }

  async function doLogin(ev){
    ev.preventDefault();
    var btn = document.getElementById("login-btn");
    var email = document.getElementById("login-email").value.trim();
    var pass = document.getElementById("login-pass").value;
    if(btn){ btn.disabled = true; btn.textContent = "Entrando…"; }
    try{
      var res = await supabase.auth.signInWithPassword({ email: email, password: pass });
      if(res.error){
        showLoginScreen("No se pudo entrar: revisá el email y la contraseña.");
      }
      // on success, onAuthStateChange (SIGNED_IN) takes over and boots the app
    }catch(e){
      showLoginScreen("No se pudo conectar. Probá de nuevo.");
    }
  }

  function afterLogin(sess){
    session = sess;
    applyRoleFromSession(sess);
    try{ supabase.realtime.setAuth(sess.access_token); }catch(e){}
    if(appBooted){ render(); return; }
    appBooted = true;
    render();
    loadInitial();
  }

  function handleSignedOut(){
    appBooted = false;
    session = null;
    state.role = null;
    if(realtimeChannel){ try{ supabase.removeChannel(realtimeChannel); }catch(e){} realtimeChannel = null; }
    appState = normalizeState(JSON.parse(JSON.stringify(DEFAULT_STATE)));
    syncStatus = "connecting";
    showLoginScreen();
  }

  function unknownAccountHtml(){
    var email = (session && session.user && session.user.email) || "";
    return '<div class="chooser">' +
      '<div><div class="brand-mark" style="margin:0 auto 16px;width:52px;height:52px;font-size:24px">IL</div>' +
      '<h1>Cuenta no reconocida</h1>' +
      '<p>La cuenta <strong>'+escapeHtml(email)+'</strong> inició sesión bien, pero todavía no está asignada a Ian ni a Lu dentro de la app.</p>' +
      '<p>Avisale a Ian para que la agregue en el código (ACCOUNT_ROLES).</p></div>' +
      '<button type="button" class="btn ghost" onclick="NV.logout()">⎋ Cerrar sesión</button>' +
      '</div>';
  }

  function syncLabel(){
    if(syncStatus === "ok") return { cls:"", text:"Sincronizado" };
    if(syncStatus === "connecting") return { cls:"off", text:"Conectando…" };
    return { cls:"bad", text:"Sin conexión — reintentando" };
  }

  function captureModalValues(){
    if(!state.modal) return null;
    var modalEl = document.querySelector(".modal");
    if(!modalEl) return null;
    var values = {};
    modalEl.querySelectorAll("input[name], textarea[name], select[name]").forEach(function(el){
      values[el.name] = el.value;
    });
    return { modal: state.modal, values: values };
  }

  function restoreModalValues(snapshot){
    if(!snapshot || snapshot.modal !== state.modal) return;
    var modalEl = document.querySelector(".modal");
    if(!modalEl) return;
    Object.keys(snapshot.values).forEach(function(name){
      var el = modalEl.querySelector('[name="' + name + '"]');
      if(el && document.activeElement !== el) el.value = snapshot.values[name];
    });
  }

  // Inline (non-modal) forms — like a goal's "aporte de este mes" field — get
  // fully rebuilt on every render() too, so an in-progress background save or
  // realtime update can silently wipe what someone is mid-typing. Same fix
  // pattern as the modal capture/restore above, applied to those forms.
  function captureInlineFormValues(){
    var out = {};
    document.querySelectorAll("form[data-goal-id]").forEach(function(f){
      var val = f.amount && f.amount.value;
      if(val) out[f.getAttribute("data-goal-id")] = val;
    });
    return out;
  }
  function restoreInlineFormValues(snapshot){
    if(!snapshot) return;
    Object.keys(snapshot).forEach(function(goalId){
      var f = document.querySelector('form[data-goal-id="' + goalId + '"]');
      if(f && f.amount) f.amount.value = snapshot[goalId];
    });
  }

  function render(){
    var app = document.getElementById("app");
    var modalSnapshot = captureModalValues();
    var inlineSnapshot = captureInlineFormValues();
    if(!state.role){
      app.innerHTML = unknownAccountHtml();
      return;
    }
    syncDataView();
    var nav = navItems();
    var sync = syncLabel();
    var sidebar =
      '<div class="sidebar">' +
        '<div class="brand"><div class="brand-mark">IL</div><div><div class="brand-name">Ian y Lu</div><div class="brand-date">'+new Date().toLocaleDateString("es-AR",{weekday:"long"})+'</div></div></div>' +
        '<div class="nav-group">' +
          '<button class="nav-item '+(state.section==='inicio'?'active':'')+'" onclick="NV.setSection(\'inicio\')"><span class="nav-ico">'+SECTION_ICON.inicio+'</span>Inicio</button>' +
        '</div>' +
        '<div><div class="nav-group-label">Compartido</div><div class="nav-group shared">' +
          nav.shared.map(function(s){
            return '<button class="nav-item '+(state.section===s?'active':'')+'" onclick="NV.setSection(\''+s+'\')"><span class="nav-ico">'+SECTION_ICON[s]+'</span>'+SECTION_TITLE[s]+'</button>';
          }).join("") +
        '</div></div>' +
        '<div><div class="nav-group-label">Personal de '+escapeHtml(roleName(state.role))+'</div><div class="nav-group personal">' +
          nav.personal.map(function(s){
            return '<button class="nav-item '+(state.section===s?'active':'')+'" onclick="NV.setSection(\''+s+'\')"><span class="nav-ico">'+SECTION_ICON[s]+'</span>'+SECTION_TITLE[s]+'</button>';
          }).join("") +
        '</div></div>' +
        '<div class="sidebar-foot">' +
          '<div class="sync-note"><span class="dot '+sync.cls+'"></span>'+sync.text+'</div>' +
          '<div class="account-pill">Ingresaste como <strong>'+escapeHtml(roleName(state.role))+'</strong></div>' +
          '<button class="settings-btn" onclick="NV.openModal(\'settings\')">⚙ Configuración</button>' +
          '<button class="settings-btn" onclick="NV.logout()">⎋ Cerrar sesión</button>' +
        '</div>' +
      '</div>';

    var mobileTop = '<div class="mobile-top"><div class="brand"><div class="brand-mark" style="width:28px;height:28px;font-size:13px">IL</div><div class="brand-name" style="font-size:15px">Ian y Lu</div></div>' +
      '<button class="settings-btn" onclick="NV.openModal(\'settings\')">⚙</button></div>';

    var group = state.section === "inicio" ? "inicio" : (nav.shared.indexOf(state.section)!==-1 ? "shared" : "personal");
    var mobileBar = '<div class="mobile-bar">' +
      '<button class="'+(group==="inicio"?"active":"")+'" onclick="NV.goGroup(\'inicio\')"><span>'+SECTION_ICON.inicio+'</span>Inicio</button>' +
      '<button class="'+(group==="shared"?"active":"")+'" onclick="NV.goGroup(\'shared\')"><span>◈</span>Compartido</button>' +
      '<button class="'+(group==="personal"?"active":"")+'" onclick="NV.goGroup(\'personal\')"><span>◎</span>Personal</button>' +
      '</div>';

    var mobileChips = "";
    if(group !== "inicio"){
      var items = group === "shared" ? nav.shared : nav.personal;
      mobileChips = '<div class="mobile-chips">' + items.map(function(s){
        return '<button class="chip '+(state.section===s?'on':'')+'" onclick="NV.setSection(\''+s+'\')">'+SECTION_ICON[s]+' '+SECTION_TITLE[s]+'</button>';
      }).join("") + '</div>';
    }

    var sectionFn = SECTION_RENDER[state.section] || sectionInicio;
    var banner = (syncStatus === "error") ? '<div class="banner">No se pudo conectar con la base de datos compartida. Reintentando en segundo plano — tus cambios se van a guardar apenas vuelva la conexión.</div>' : '';

    app.innerHTML = sidebar + mobileTop + mobileChips + '<main>' + banner + sectionFn() + '</main>' + mobileBar + modalHtml();
    restoreModalValues(modalSnapshot);
    restoreInlineFormValues(inlineSnapshot);
  }

  /* ---------------- boot / auth ---------------- */
  supabase.auth.onAuthStateChange(function(event, sess){
    if(sess && (event === "SIGNED_IN" || event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED")){
      afterLogin(sess);
    } else if(event === "SIGNED_OUT" || (event === "INITIAL_SESSION" && !sess)){
      handleSignedOut();
    }
  });
  supabase.auth.getSession().then(function(res){
    var sess = res.data && res.data.session;
    if(sess){ afterLogin(sess); } else { showLoginScreen(); }
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* instalación opcional; la app funciona igual sin esto */ });
    });
  }
})();
</script>
</body>
</html>
