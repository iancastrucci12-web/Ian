<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ian y Lu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#EEF0EA;
    --surface:#FFFFFF;
    --surface-2:#F7F8F3;
    --ink:#202824;
    --ink-soft:#5B655B;
    --line:#D9DCD0;
    --wine:#7A3B58;
    --wine-soft:#F3E7ED;
    --moss:#4F6B4A;
    --moss-soft:#E9EFE5;
    --gold:#B8873A;
    --good:#2F8F5B;
    --good-soft:#E4F2E9;
    --warn:#C99A3E;
    --warn-soft:#FBF1DE;
    --bad:#B4453A;
    --bad-soft:#FBE7E4;
    --shadow: 0 1px 2px rgba(32,40,36,.06), 0 6px 20px rgba(32,40,36,.06);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161B17;
      --surface:#1F2621;
      --surface-2:#242C25;
      --ink:#E9ECE5;
      --ink-soft:#A6AFA1;
      --line:#333B33;
      --wine:#D98FAE;
      --wine-soft:#3A2530;
      --moss:#8FB285;
      --moss-soft:#243024;
      --gold:#D9AE6F;
      --good:#7BC79A;
      --good-soft:#1E3126;
      --warn:#E0BB6E;
      --warn-soft:#3A311F;
      --bad:#E28579;
      --bad-soft:#3A2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#161B17;
    --surface:#1F2621;
    --surface-2:#242C25;
    --ink:#E9ECE5;
    --ink-soft:#A6AFA1;
    --line:#333B33;
    --wine:#D98FAE;
    --wine-soft:#3A2530;
    --moss:#8FB285;
    --moss-soft:#243024;
    --gold:#D9AE6F;
    --good:#7BC79A;
    --good-soft:#1E3126;
    --warn:#E0BB6E;
    --warn-soft:#3A311F;
    --bad:#E28579;
    --bad-soft:#3A2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--wine-soft); }
  :focus-visible{ outline:2px solid var(--wine); outline-offset:2px; }

  #app{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px; flex:none;
    background:linear-gradient(155deg, var(--wine), var(--moss));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:17px;
  }
  .brand-name{ font-size:18px; }
  .brand-date{ font-size:11.5px; color:var(--ink-soft); text-transform:capitalize; }

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-soft); padding:0 10px; margin-bottom:2px; font-weight:600;
  }
  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    border:none; background:none; color:var(--ink); font-size:13.5px; cursor:pointer;
    text-align:left; width:100%;
  }
  .nav-item:hover{ background:var(--surface-2); }
  .nav-item.active{ background:var(--moss-soft); color:var(--moss); font-weight:600; }
  .nav-group.shared .nav-item.active{ background:var(--wine-soft); color:var(--wine); }
  .nav-ico{ width:16px; text-align:center; font-size:14px; flex:none; }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
  .role-pill{
    display:flex; border:1px solid var(--line); border-radius:11px; padding:3px; background:var(--surface-2);
  }
  .role-btn{
    flex:1; border:none; background:none; padding:7px 8px; border-radius:8px; cursor:pointer;
    font-size:12.5px; color:var(--ink-soft); font-weight:500;
  }
  .role-btn.on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .settings-btn{
    border:1px solid var(--line); background:var(--surface-2); border-radius:9px; padding:8px 10px;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer; display:flex; gap:8px; align-items:center;
  }
  .settings-btn:hover{ color:var(--ink); }

  /* ---------- mobile top/bottom bars ---------- */
  .mobile-bar{ display:none; }
  .mobile-chips{ display:none; }

  /* ---------- main ---------- */
  main{ flex:1; min-width:0; padding:30px 34px 90px; max-width:920px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .section-head h1{ font-size:26px; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin-top:3px; }
  .tag-shared, .tag-personal{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    padding:3px 9px; border-radius:20px;
  }
  .tag-shared{ background:var(--wine-soft); color:var(--wine); }
  .tag-personal{ background:var(--moss-soft); color:var(--moss); }

  .btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--ink-soft); }
  .btn.primary{ background:var(--wine); border-color:var(--wine); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.primary.moss{ background:var(--moss); border-color:var(--moss); }
  .btn.ghost{ border-color:transparent; background:none; }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn.danger{ color:var(--bad); }

  .grid-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; }
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .tile-label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .tile-value{ font-family:'Fraunces',serif; font-size:23px; font-weight:600; }
  .tile-value.good{ color:var(--good); } .tile-value.bad{ color:var(--bad); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px;
  }
  .card h2{ font-size:16px; margin-bottom:10px; }

  .list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:flex-start; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .check{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line); flex:none; margin-top:2px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface); font-size:12px;
  }
  .check.on{ background:var(--moss); border-color:var(--moss); color:#fff; }
  .row-body{ flex:1; min-width:0; }
  .row-title{ font-size:14px; font-weight:500; }
  .row-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .row-meta{ display:flex; gap:8px; align-items:center; margin-top:4px; flex-wrap:wrap; }
  .pill{
    font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;
  }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .avatar{
    width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:#fff;
  }
  .row-actions{ display:flex; gap:4px; flex:none; }
  .icon-btn{
    border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:4px; border-radius:6px; font-size:13px;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

  .empty{ color:var(--ink-soft); font-size:13.5px; padding:18px 2px; text-align:center; }

  /* forms */
  .form{ display:flex; flex-direction:column; gap:10px; }
  .form-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:13.5px; background:var(--surface);
    color:var(--ink); font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--wine); outline-offset:0; }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:2px; }

  /* finance ledger */
  .ledger-row{
    display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px dashed var(--line);
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-desc{ flex:1; min-width:0; }
  .ledger-desc .cat{ font-size:11px; color:var(--ink-soft); }
  .ledger-amt{ font-size:14px; font-weight:600; }
  .ledger-amt.in{ color:var(--good); } .ledger-amt.out{ color:var(--bad); }
  .bars{ display:flex; flex-direction:column; gap:8px; }
  .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .bar-label{ width:96px; flex:none; color:var(--ink-soft); }
  .bar-track{ flex:1; height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--wine); border-radius:6px; }
  .bar-val{ width:56px; text-align:right; flex:none; font-family:'IBM Plex Mono',monospace; }

  /* calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .cal-dow{ text-align:center; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:1; border-radius:9px; background:var(--surface-2); display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:12.5px; gap:3px; position:relative;
  }
  .cal-cell.today{ background:var(--wine); color:#fff; font-weight:700; }
  .cal-cell.empty{ background:none; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--moss); }
  .cal-cell.today .cal-dot{ background:#fff; }

  /* goals */
  .goal-progress{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin:8px 0; }
  .goal-progress-fill{ height:100%; background:var(--wine); }

  /* kanban (clients) */
  .kanban{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; overflow-x:auto; }
  .kanban-col{ background:var(--surface-2); border-radius:12px; padding:10px; min-width:150px; }
  .kanban-col h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px; padding:0 2px; }
  .client-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px;
    box-shadow:var(--shadow); font-size:12.5px;
  }
  .client-card .name{ font-weight:700; font-size:13.5px; margin-bottom:2px; }
  .client-card .empresa{ color:var(--ink-soft); margin-bottom:6px; }
  .client-card select{ width:100%; font-size:11.5px; border:1px solid var(--line); border-radius:6px; padding:4px 6px; margin-top:6px; background:var(--surface); color:var(--ink); }

  /* notes */
  .notes-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .note-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
  .note-card h3{ font-size:14px; margin-bottom:6px; font-family:'Fraunces',serif; }
  .note-card p{ font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap; margin:0; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:16px; padding:22px; width:100%; max-width:420px; box-shadow:var(--shadow);
    max-height:86vh; overflow-y:auto;
  }
  .modal h2{ font-size:18px; margin-bottom:14px; }

  /* who-are-you chooser */
  .chooser{
    position:fixed; inset:0; background:var(--paper); z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; text-align:center; padding:20px;
  }
  .chooser h1{ font-size:30px; }
  .chooser p{ color:var(--ink-soft); max-width:360px; }
  .chooser-btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .chooser-btn{
    border:1.5px solid var(--line); background:var(--surface); border-radius:16px; padding:22px 30px;
    font-family:'Fraunces',serif; font-size:19px; font-weight:600; cursor:pointer; min-width:150px;
    box-shadow:var(--shadow);
  }
  .chooser-btn:hover{ border-color:var(--wine); color:var(--wine); }

  .sync-note{ font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; padding:0 6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }
  .dot.off{ background:var(--warn); }
  .dot.bad{ background:var(--bad); }
  .banner{
    background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:9px 14px; font-size:12.5px;
    margin-bottom:18px;
  }

  @media (max-width:860px){
    .sidebar{ display:none; }
    #app{ flex-direction:column; }
    main{ padding:18px 16px 90px; max-width:none; }
    .grid-tiles{ grid-template-columns:repeat(2,1fr); }
    .kanban{ grid-template-columns:repeat(5,minmax(140px,1fr)); }
    .mobile-bar{
      display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
      padding:8px 6px 10px; gap:2px; z-index:40; justify-content:space-around;
    }
    .mobile-bar button{
      flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:none;
      color:var(--ink-soft); font-size:10px; padding:4px; border-radius:8px;
    }
    .mobile-bar button.active{ color:var(--wine); }
    .mobile-top{
      display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; position:sticky; top:0;
      background:var(--paper); z-index:30;
    }
    .mobile-chips{
      display:flex; gap:6px; overflow-x:auto; padding:8px 16px 2px; position:sticky; top:44px; background:var(--paper); z-index:29;
    }
    .chip{
      flex:none; border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:6px 12px;
      font-size:12px; color:var(--ink-soft); white-space:nowrap;
    }
    .chip.on{ background:var(--moss); border-color:var(--moss); color:#fff; }
  }
  @media (min-width:861px){ .mobile-top{ display:none; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Supabase ---------------- */
  var SUPABASE_URL = "https://bueistmiugoyjzyewppt.supabase.co";
  var SUPABASE_KEY = "sb_publishable_uWGnj2RINGiz51GTMaHJ3Q_qobugTJI";
  var ROW_ID = "ian_y_lu";
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------------- constants ---------------- */
  var FIN_CATS = ["Comida","Alquiler/Casa","Transporte","Ocio","Ahorro","Salud","Otro"];
  var EVENT_CATS = {cumple:"Cumpleaños", aniversario:"Aniversario", viaje:"Viaje", otro:"Otro"};
  var STAGES = [
    {key:"nuevo", label:"Nuevo"},
    {key:"contactado", label:"Contactado"},
    {key:"propuesta", label:"Propuesta"},
    {key:"cerrado", label:"Cerrado"},
    {key:"perdido", label:"Perdido"}
  ];
  var MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var DOWS = ["L","M","M","J","V","S","D"];
  var ROLE_COLORS = { ian:"#7A3B58", partner:"#4F6B4A" };
  var DEFAULT_STATE = {
    config: { names: { ian: "Ian", partner: "Mi pareja" }, currency: "$" },
    sharedTasks: [], financeTx: [], events: [], goals: [],
    personal: { ian: { tasks: [], clients: [] }, partner: { tasks: [], notes: [] } }
  };

  /* ---------------- state ---------------- */
  var appState = normalizeState(JSON.parse(JSON.stringify(DEFAULT_STATE)));
  var syncStatus = "connecting"; // connecting | ok | error
  var saveTimer = null;

  var state = {
    role: localStorage.getItem("nv-role") || null,
    section: "inicio",
    lastShared: "tareas",
    lastPersonal: null,
    data: { sharedTasks: [], financeTx: [], events: [], goals: [], myTasks: [], myClients: [], myNotes: [] },
    modal: null
  };

  function normalizeState(s){
    s = s || {};
    s.config = s.config || { names:{ian:"Ian",partner:"Mi pareja"}, currency:"$" };
    s.config.names = Object.assign({ian:"Ian",partner:"Mi pareja"}, s.config.names||{});
    s.config.currency = s.config.currency || "$";
    s.sharedTasks = s.sharedTasks || [];
    s.financeTx = s.financeTx || [];
    s.events = s.events || [];
    s.goals = s.goals || [];
    s.personal = s.personal || {};
    s.personal.ian = s.personal.ian || {};
    s.personal.ian.tasks = s.personal.ian.tasks || [];
    s.personal.ian.clients = s.personal.ian.clients || [];
    s.personal.partner = s.personal.partner || {};
    s.personal.partner.tasks = s.personal.partner.tasks || [];
    s.personal.partner.notes = s.personal.partner.notes || [];
    return s;
  }

  function fmtMoney(n){
    var c = appState.config.currency || "$";
    var v = Math.round(n);
    return c + v.toLocaleString("es-AR");
  }
  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("es-AR", {day:"numeric", month:"short"});
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function otherRole(r){ return r === "ian" ? "partner" : "ian"; }
  function roleName(r){ return appState.config.names[r] || (r==="ian"?"Ian":"Mi pareja"); }
  function roleInitial(r){ return (roleName(r)||"?").trim().charAt(0).toUpperCase(); }

  /* ---------------- data view ---------------- */
  function syncDataView(){
    state.data.sharedTasks = appState.sharedTasks;
    state.data.financeTx = appState.financeTx;
    state.data.events = appState.events;
    state.data.goals = appState.goals;
    if(state.role){
      state.data.myTasks = appState.personal[state.role].tasks;
    }
    state.data.myClients = appState.personal.ian.clients;
    state.data.myNotes = appState.personal.partner.notes;
  }

  function getArray(listKey){
    if(listKey === "sharedTasks") return appState.sharedTasks;
    if(listKey === "myTasks") return appState.personal[state.role].tasks;
    if(listKey === "financeTx") return appState.financeTx;
    if(listKey === "events") return appState.events;
    if(listKey === "goals") return appState.goals;
    if(listKey === "myClients") return appState.personal.ian.clients;
    if(listKey === "myNotes") return appState.personal.partner.notes;
    return [];
  }

  /* ---------------- Supabase load / realtime / save ---------------- */
  async function loadInitial(){
    try{
      var res = await supabase.from("app_state").select("data").eq("id", ROW_ID).single();
      if(res.error || !res.data){
        syncStatus = "error";
      } else {
        appState = normalizeState(res.data.data || {});
        syncStatus = "ok";
      }
    }catch(e){
      syncStatus = "error";
    }
    syncDataView();
    render();
    subscribeRealtime();
  }

  function subscribeRealtime(){
    try{
      supabase.channel("app_state_sync")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "app_state", filter: "id=eq." + ROW_ID }, function(payload){
          appState = normalizeState((payload.new && payload.new.data) || {});
          syncDataView();
          render();
        })
        .subscribe(function(status){
          if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
            if(syncStatus === "ok"){ syncStatus = "error"; render(); }
          }
        });
    }catch(e){ /* realtime optional; polling fallback not implemented, writes still work */ }
  }

  function persist(){
    syncDataView();
    render();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 200);
  }

  async function doSave(){
    try{
      var res = await supabase.from("app_state")
        .update({ data: appState, updated_at: new Date().toISOString() })
        .eq("id", ROW_ID);
      if(res.error){
        syncStatus = "error";
      } else if(syncStatus !== "ok"){
        syncStatus = "ok";
      }
    }catch(e){
      syncStatus = "error";
    }
    render();
  }

  function setRole(r){
    state.role = r;
    localStorage.setItem("nv-role", r);
    state.lastPersonal = "mis-tareas";
    syncDataView();
    render();
  }

  /* ---------------- mutations ---------------- */
  function addSharedTask(title, dueDate){
    if(!title) return;
    appState.sharedTasks.push({ id: uid(), title: title, done:false, dueDate: dueDate||null, createdBy: state.role, createdAt: Date.now() });
    persist();
  }
  function addMyTask(title, dueDate){
    if(!title) return;
    appState.personal[state.role].tasks.push({ id: uid(), title:title, done:false, dueDate:dueDate||null, createdAt:Date.now() });
    persist();
  }
  function toggleTask(listKey, id){
    var arr = getArray(listKey);
    var item = arr.find(function(x){ return x.id === id; });
    if(item){ item.done = !item.done; persist(); }
  }
  function deleteItem(listKey, id){
    var arr = getArray(listKey);
    var idx = arr.findIndex(function(x){ return x.id === id; });
    if(idx !== -1){ arr.splice(idx,1); persist(); }
  }
  function addTx(desc, amount, type, category, date){
    if(!desc || !amount) return;
    appState.financeTx.unshift({ id: uid(), desc:desc, amount: Math.abs(Number(amount)), type:type, category:category, date: date||todayISO(), addedBy: state.role });
    persist();
  }
  function addEvent(title, date, category, notes){
    if(!title || !date) return;
    appState.events.push({ id: uid(), title:title, date:date, category:category, notes:notes||"" });
    appState.events.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    persist();
  }
  function addGoal(title, description, targetDate){
    if(!title) return;
    appState.goals.unshift({ id: uid(), title:title, description:description||"", progress:0, status:"activa", targetDate: targetDate||null, createdAt: Date.now() });
    persist();
  }
  function setGoalProgress(id, val){
    var item = appState.goals.find(function(x){ return x.id === id; });
    if(!item) return;
    var v = Number(val);
    item.progress = v;
    item.status = v >= 100 ? "lograda" : (item.status === "pausada" ? "pausada" : "activa");
    persist();
  }
  function addClient(name, empresa, stage, nextContact, notes){
    if(!name) return;
    appState.personal.ian.clients.push({ id: uid(), name:name, empresa:empresa||"", stage:stage||"nuevo", nextContact: nextContact||null, notes: notes||"" });
    persist();
  }
  function setClientStage(id, stage){
    var item = appState.personal.ian.clients.find(function(x){ return x.id === id; });
    if(item){ item.stage = stage; persist(); }
  }
  function addNote(title, body){
    if(!title) return;
    appState.personal.partner.notes.unshift({ id: uid(), title:title, body:body||"", updatedAt: Date.now() });
    persist();
  }
  function saveConfig(names, currency){
    appState.config.names = names;
    appState.config.currency = currency;
    persist();
  }

  /* ---------------- render helpers ---------------- */
  function dueClass(dueDate, done){
    if(done || !dueDate) return "neutral";
    if(dueDate < todayISO()) return "bad";
    if(dueDate === todayISO()) return "warn";
    return "neutral";
  }
  function dueLabel(dueDate, done){
    if(!dueDate) return null;
    if(done) return fmtDate(dueDate);
    if(dueDate < todayISO()) return "Venció " + fmtDate(dueDate);
    if(dueDate === todayISO()) return "Hoy";
    return fmtDate(dueDate);
  }

  function taskRow(item, listKey){
    var due = dueLabel(item.dueDate, item.done);
    var creator = item.createdBy;
    return (
      '<div class="row">' +
        '<button class="check ' + (item.done?'on':'') + '" onclick="NV.toggleTask(\''+listKey+'\',\''+item.id+'\')">' + (item.done?'✓':'') + '</button>' +
        '<div class="row-body">' +
          '<div class="row-title ' + (item.done?'done':'') + '">' + escapeHtml(item.title) + '</div>' +
          '<div class="row-meta">' +
            (due ? '<span class="pill ' + dueClass(item.dueDate,item.done) + '">' + due + '</span>' : '') +
            (creator ? '<span class="avatar" style="background:'+ROLE_COLORS[creator]+'" title="'+escapeHtml(roleName(creator))+'">'+roleInitial(creator)+'</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="row-actions"><button class="icon-btn" onclick="NV.deleteItem(\''+listKey+'\',\''+item.id+'\')">✕</button></div>' +
      '</div>'
    );
  }

  window.NV = {
    toggleTask: function(listKey, id){ toggleTask(listKey, id); },
    deleteItem: function(listKey, id){ deleteItem(listKey, id); },
    setGoalProgress: function(id, val){ setGoalProgress(id, val); },
    setClientStage: function(id, stage){ setClientStage(id, stage); },
    setSection: function(s){
      state.section = s;
      var nav = navItems();
      if(nav.shared.indexOf(s) !== -1) state.lastShared = s;
      if(nav.personal.indexOf(s) !== -1) state.lastPersonal = s;
      render();
    },
    goGroup: function(g){
      if(g === "inicio"){ NV.setSection("inicio"); return; }
      if(g === "shared"){ NV.setSection(state.lastShared || "tareas"); return; }
      var nav = navItems();
      NV.setSection(state.lastPersonal && nav.personal.indexOf(state.lastPersonal)!==-1 ? state.lastPersonal : nav.personal[0]);
    },
    setRole: function(r){ setRole(r); },
    openModal: function(name){ state.modal = name; render(); },
    closeModal: function(){ state.modal = null; render(); },
    submitTask: function(ev, listKey){
      ev.preventDefault();
      var f = ev.target;
      var title = f.title.value.trim();
      var due = f.dueDate.value;
      if(listKey === "shared") addSharedTask(title, due); else addMyTask(title, due);
      f.reset(); state.modal = null; render();
    },
    submitTx: function(ev){
      ev.preventDefault();
      var f = ev.target;
      addTx(f.desc.value.trim(), f.amount.value, f.type.value, f.category.value, f.date.value || todayISO());
      f.reset(); state.modal = null; render();
    },
    submitEvent: function(ev){
      ev.preventDefault();
      var f = ev.target;
      addEvent(f.title.value.trim(), f.date.value, f.category.value, f.notes.value.trim());
      f.reset(); state.modal = null; render();
    },
    submitGoal: function(ev){
      ev.preventDefault();
      var f = ev.target;
      addGoal(f.title.value.trim(), f.description.value.trim(), f.targetDate.value);
      f.reset(); state.modal = null; render();
    },
    submitClient: function(ev){
      ev.preventDefault();
      var f = ev.target;
      addClient(f.name.value.trim(), f.empresa.value.trim(), f.stage.value, f.nextContact.value, f.notes.value.trim());
      f.reset(); state.modal = null; render();
    },
    submitNote: function(ev){
      ev.preventDefault();
      var f = ev.target;
      addNote(f.title.value.trim(), f.body.value.trim());
      f.reset(); state.modal = null; render();
    },
    submitConfig: function(ev){
      ev.preventDefault();
      var f = ev.target;
      saveConfig({ian: f.ianName.value.trim()||"Ian", partner: f.partnerName.value.trim()||"Mi pareja"}, f.currency.value.trim()||"$");
      state.modal = null; render();
    }
  };

    var income=0, expense=0;
    state.data.financeTx.forEach(function(t){

      }
    });
    var balance = income-expense;
    var nextEvent = state.data.events.filter(function(e){return e.date>=todayISO();}).sort(function(a,b){return a.date.localeCompare(b.date);})[0];
    var activeGoals = state.data.goals.filter(function(g){return g.status==="activa";}).length;
    var upcoming = state.data.sharedTasks.filter(function(t){return !t.done;}).slice(0,5);

    return (
      '<div class="section-head"><div><h1>Hola, '+escapeHtml(roleName(state.role))+'</h1>' +

      '<div class="grid-tiles">' +
        '<div class="tile"><div class="tile-label">Tareas pendientes</div><div class="tile-value">'+pend+'</div></div>' +
        '<div class="tile"><div class="tile-label">Balance del mes</div><div class="tile-value '+(balance>=0?'good':'bad')+'">'+fmtMoney(balance)+'</div></div>' +
        '<div class="tile"><div class="tile-label">Próximo evento</div><div class="tile-value" style="font-size:16px">'+(nextEvent?escapeHtml(nextEvent.title)+' · '+fmtDate(nextEvent.date):'—')+'</div></div>' +
        '<div class="tile"><div class="tile-label">Metas activas</div><div class="tile-value">'+activeGoals+'</div></div>' +
      '</div>' +
      '<div class="card"><h2>Pendientes compartidos</h2><div class="list">' +
        (upcoming.length ? upcoming.map(function(t){return taskRow(t,"sharedTasks");}).join("") : '<div class="empty">Sin tareas pendientes. Buen trabajo.</div>') +
      '</div></div>'

  function monthBreakdown(){
    var now = new Date();
    var monthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    var byCat = {};
    var totalExpense = 0;
    state.data.financeTx.forEach(function(t){
      if(t.type==="gasto" && (t.date||"").slice(0,7)===monthKey){
        byCat[t.category] = (byCat[t.category]||0) + Number(t.amount||0);
        totalExpense += Number(t.amount||0);
      }
    });
    var cats = Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
    if(!cats.length) return '<div class="empty">Todavía no hay gastos este mes.</div>';
    return '<div class="bars">' + cats.map(function(c){
      var v = byCat[c]; var pct = totalExpense ? Math.round(v/totalExpense*100) : 0;
      return '<div class="bar-row"><div class="bar-label">'+escapeHtml(c)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-val mono">'+fmtMoney(v)+'</div></div>';
    }).join("") + '</div>';
  }

    var now = new Date();
    var monthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    var income=0, expense=0;
    state.data.financeTx.forEach(function(t){
      if((t.date||"").slice(0,7)===monthKey){
        if(t.type==="ingreso") income+=Number(t.amount||0); else expense+=Number(t.amount||0);
      }
    });
    var rows = state.data.financeTx.slice(0,30);

        '<div class="tile"><div class="tile-label">Gastos del mes</div><div class="tile-value bad">'+fmtMoney(expense)+'</div></div>' +

  function sectionCalendar(){
    var now = new Date();
    var y=now.getFullYear(), m=now.getMonth();
    var first = new Date(y,m,1);
    var startDow = (first.getDay()+6)%7;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var eventsByDay = {};
    state.data.events.forEach(function(e){
      if(e.date && e.date.slice(0,7) === (y+"-"+String(m+1).padStart(2,"0"))){
        var day = Number(e.date.slice(8,10));
        eventsByDay[day] = (eventsByDay[day]||0)+1;
      }
    });
    var cells = [];
    for(var i=0;i<startDow;i++) cells.push('<div class="cal-cell empty"></div>');
    for(var d=1; d<=daysInMonth; d++){
      var isToday = d === now.getDate();
      cells.push('<div class="cal-cell '+(isToday?'today':'')+'">'+d+ (eventsByDay[d] ? '<span class="cal-dot"></span>' : '') +'</div>');
    }
    var upcoming = state.data.events.filter(function(e){return e.date>=todayISO();}).sort(function(a,b){return a.date.localeCompare(b.date);});
    return (
      '<div class="section-head"><div><h1>Calendario <span class="tag-shared">Compartido</span></h1><div class="section-sub">'+MONTHS[m]+' de '+y+'</div></div>' +
      '<button class="btn primary" onclick="NV.openModal(\'event\')">+ Evento</button></div>' +
      '<div class="card"><div class="cal-grid">' + DOWS.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("") + cells.join("") + '</div></div>' +
      '<div class="card"><h2>Próximos eventos</h2><div class="list">' +
      (upcoming.length ? upcoming.map(function(e){
        return '<div class="row"><div class="row-body"><div class="row-title">'+escapeHtml(e.title)+'</div>' +
          '<div class="row-meta"><span class="pill neutral">'+fmtDate(e.date)+'</span><span class="pill neutral">'+escapeHtml(EVENT_CATS[e.category]||"Otro")+'</span></div>' +
          (e.notes ? '<div class="section-sub" style="margin-top:4px">'+escapeHtml(e.notes)+'</div>' : '') +
          '</div><div class="row-actions"><button class="icon-btn" onclick="NV.deleteItem(\'events\',\''+e.id+'\')">✕</button></div></div>';
      }).join("") : '<div class="empty">No hay eventos próximos.</div>') +
      '</div></div>'
    );
  }

  function modalHtml(){
    if(!state.modal) return "";
    var content = "";
    if(state.modal === "task-shared" || state.modal === "task-mine"){
      var isShared = state.modal === "task-shared";
      content = '<h2>'+(isShared?'Nueva tarea compartida':'Nueva tarea personal')+'</h2>' +
        '<form class="form" onsubmit="NV.submitTask(event, \''+(isShared?'shared':'mine')+'\')">' +
        '<div class="field"><label>Título</label><input name="title" required autofocus placeholder="¿Qué hay que hacer?"></div>' +
        '<div class="field"><label>Fecha límite (opcional)</label><input type="date" name="dueDate"></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>' +
        '</form>';
    } else if(state.modal === "tx"){
      content = '<h2>Nuevo movimiento</h2><form class="form" onsubmit="NV.submitTx(event)">' +
        '<div class="field"><label>Descripción</label><input name="desc" required autofocus placeholder="Ej: Supermercado"></div>' +
        '<div class="form-row">' +
        '<div class="field"><label>Monto</label><input type="number" step="0.01" name="amount" required></div>' +
        '<div class="field"><label>Tipo</label><select name="type"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div>' +
        '</div><div class="form-row">' +
        '<div class="field"><label>Categoría</label><select name="category">'+FIN_CATS.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select></div>' +
        '<div class="field"><label>Fecha</label><input type="date" name="date" value="'+todayISO()+'"></div>' +
        '</div><div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "event"){
      content = '<h2>Nuevo evento</h2><form class="form" onsubmit="NV.submitEvent(event)">' +
        '<div class="field"><label>Título</label><input name="title" required autofocus></div>' +
        '<div class="form-row">' +
        '<div class="field"><label>Fecha</label><input type="date" name="date" required></div>' +
        '<div class="field"><label>Tipo</label><select name="category">'+Object.keys(EVENT_CATS).map(function(k){return '<option value="'+k+'">'+EVENT_CATS[k]+'</option>';}).join("")+'</select></div>' +
        '</div><div class="field"><label>Notas (opcional)</label><textarea name="notes"></textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "goal"){
      content = '<h2>Nueva meta</h2><form class="form" onsubmit="NV.submitGoal(event)">' +
        '<div class="field"><label>Título</label><input name="title" required autofocus placeholder="Ej: Ahorrar para el viaje"></div>' +
        '<div class="field"><label>Descripción (opcional)</label><textarea name="description"></textarea></div>' +
        '<div class="field"><label>Fecha objetivo (opcional)</label><input type="date" name="targetDate"></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "client"){
      content = '<h2>Nuevo cliente</h2><form class="form" onsubmit="NV.submitClient(event)">' +
        '<div class="field"><label>Nombre</label><input name="name" required autofocus></div>' +
        '<div class="field"><label>Empresa (opcional)</label><input name="empresa"></div>' +
        '<div class="form-row">' +
        '<div class="field"><label>Etapa</label><select name="stage">'+STAGES.map(function(s){return '<option value="'+s.key+'">'+s.label+'</option>';}).join("")+'</select></div>' +
        '<div class="field"><label>Próximo contacto</label><input type="date" name="nextContact"></div>' +
        '</div><div class="field"><label>Notas (opcional)</label><textarea name="notes"></textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary moss" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "note"){
      content = '<h2>Nueva nota</h2><form class="form" onsubmit="NV.submitNote(event)">' +
        '<div class="field"><label>Título</label><input name="title" required autofocus></div>' +
        '<div class="field"><label>Contenido</label><textarea name="body" rows="5"></textarea></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary moss" type="submit">Guardar</button></div></form>';
    } else if(state.modal === "settings"){
      content = '<h2>Configuración</h2><form class="form" onsubmit="NV.submitConfig(event)">' +
        '<div class="field"><label>Nombre de Ian</label><input name="ianName" value="'+escapeHtml(appState.config.names.ian)+'"></div>' +
        '<div class="field"><label>Nombre de tu pareja</label><input name="partnerName" value="'+escapeHtml(appState.config.names.partner)+'"></div>' +
        '<div class="field"><label>Símbolo de moneda</label><input name="currency" value="'+escapeHtml(appState.config.currency)+'" style="max-width:80px"></div>' +
        '<div class="form-actions"><button type="button" class="btn ghost" onclick="NV.closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>';
    }
    return '<div class="overlay" onclick="if(event.target===this) NV.closeModal()"><div class="modal">'+content+'</div></div>';
  }

  function chooserHtml(){
    return '<div class="chooser">' +
      '<div><div class="brand-mark" style="margin:0 auto 16px;width:52px;height:52px;font-size:24px">IL</div>' +
      '<h1>Ian y Lu</h1><p>Un espacio compartido para organizar la vida en pareja: tareas, finanzas, calendario y metas — más un rincón personal para cada uno.</p></div>' +
      '<div><div class="section-sub" style="margin-bottom:10px">¿Quién sos?</div><div class="chooser-btns">' +
      '<button class="chooser-btn" onclick="NV.setRole(\'ian\')">'+escapeHtml(appState.config.names.ian)+'</button>' +
      '<button class="chooser-btn" onclick="NV.setRole(\'partner\')">'+escapeHtml(appState.config.names.partner)+'</button>' +
      '</div></div></div>';
  }

  function syncLabel(){
    if(syncStatus === "ok") return { cls:"", text:"Sincronizado" };
    if(syncStatus === "connecting") return { cls:"off", text:"Conectando…" };
    return { cls:"bad", text:"Sin conexión — reintentando" };
  }

  function render(){
    var app = document.getElementById("app");
    if(!state.role){
      app.innerHTML = chooserHtml();
      return;
    }
    syncDataView();
    var nav = navItems();
    var sync = syncLabel();
    var sidebar =
      '<div class="sidebar">' +
        '<div class="brand"><div class="brand-mark">IL</div><div><div class="brand-name">Ian y Lu</div><div class="brand-date">'+new Date().toLocaleDateString("es-AR",{weekday:"long"})+'</div></div></div>' +
        '<div class="nav-group">' +
          '<button class="nav-item '+(state.section==='inicio'?'active':'')+'" onclick="NV.setSection(\'inicio\')"><span class="nav-ico">'+SECTION_ICON.inicio+'</span>Inicio</button>' +
        '</div>' +
        '<div><div class="nav-group-label">Compartido</div><div class="nav-group shared">' +
          nav.shared.map(function(s){
            return '<button class="nav-item '+(state.section===s?'active':'')+'" onclick="NV.setSection(\''+s+'\')"><span class="nav-ico">'+SECTION_ICON[s]+'</span>'+SECTION_TITLE[s]+'</button>';
          }).join("") +
        '</div></div>' +
        '<div><div class="nav-group-label">Personal de '+escapeHtml(roleName(state.role))+'</div><div class="nav-group personal">' +
          nav.personal.map(function(s){
            return '<button class="nav-item '+(state.section===s?'active':'')+'" onclick="NV.setSection(\''+s+'\')"><span class="nav-ico">'+SECTION_ICON[s]+'</span>'+SECTION_TITLE[s]+'</button>';
          }).join("") +
        '</div></div>' +
        '<div class="sidebar-foot">' +
          '<div class="sync-note"><span class="dot '+sync.cls+'"></span>'+sync.text+'</div>' +
          '<div class="role-pill">' +
            '<button class="role-btn '+(state.role==='ian'?'on':'')+'" onclick="NV.setRole(\'ian\')">'+escapeHtml(appState.config.names.ian)+'</button>' +
            '<button class="role-btn '+(state.role==='partner'?'on':'')+'" onclick="NV.setRole(\'partner\')">'+escapeHtml(appState.config.names.partner)+'</button>' +
          '</div>' +
          '<button class="settings-btn" onclick="NV.openModal(\'settings\')">⚙ Configuración</button>' +
        '</div>' +
      '</div>';

    var mobileTop = '<div class="mobile-top"><div class="brand"><div class="brand-mark" style="width:28px;height:28px;font-size:13px">IL</div><div class="brand-name" style="font-size:15px">Ian y Lu</div></div>' +
      '<button class="settings-btn" onclick="NV.openModal(\'settings\')">⚙</button></div>';

    var group = state.section === "inicio" ? "inicio" : (nav.shared.indexOf(state.section)!==-1 ? "shared" : "personal");
    var mobileBar = '<div class="mobile-bar">' +
      '<button class="'+(group==="inicio"?"active":"")+'" onclick="NV.goGroup(\'inicio\')"><span>'+SECTION_ICON.inicio+'</span>Inicio</button>' +
      '<button class="'+(group==="shared"?"active":"")+'" onclick="NV.goGroup(\'shared\')"><span>◈</span>Compartido</button>' +
      '<button class="'+(group==="personal"?"active":"")+'" onclick="NV.goGroup(\'personal\')"><span>◎</span>Personal</button>' +
      '</div>';

    var mobileChips = "";
    if(group !== "inicio"){
      var items = group === "shared" ? nav.shared : nav.personal;
      mobileChips = '<div class="mobile-chips">' + items.map(function(s){
        return '<button class="chip '+(state.section===s?'on':'')+'" onclick="NV.setSection(\''+s+'\')">'+SECTION_ICON[s]+' '+SECTION_TITLE[s]+'</button>';
      }).join("") + '</div>';
    }

    var sectionFn = SECTION_RENDER[state.section] || sectionInicio;
    var banner = (syncStatus === "error") ? '<div class="banner">No se pudo conectar con la base de datos compartida. Reintentando en segundo plano — tus cambios se van a guardar apenas vuelva la conexión.</div>' : '';

    app.innerHTML = sidebar + mobileTop + mobileChips + '<main>' + banner + sectionFn() + '</main>' + mobileBar + modalHtml();
  }

  /* ---------------- boot ---------------- */
  render();
  loadInitial();
})();
</script>
</body>
</html>
